<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        *{
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>
    <header class="w-[80%] mx-auto mt-10 space-y-4">
        <div>
            <h1 class="text-5xl font-bold text-[#002c5cFF]">Job Application Tracker</h1>
        </div>
        <div class="grid grid-cols-3 gap-4 mb-[30px]">
            <div class="shadow p-5 rounded-md">
                <p class="text-[0.875rem]">Total</p>
                <p class="text-[1.5rem] text-[#002c5cFF]">0</p>
            </div>
            <div class="shadow p-5 rounded-md">
                <p class="text-[0.875rem]">Interview</p>
                <p class="text-[1.5rem] text-[#10b981FF]">0</p>
            </div>
            <div class="shadow p-5 rounded-md">
                <p class="text-[0.875rem]">Rejected</p>
                <p class="text-[1.5rem] text-[#ef4444FF]">0</p>
            </div>
        </div>
        <hr class="border-[#e6e7e9FF]">
    </header>
</body>

</html>
